<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Versões: linha do tempo com ramificação, num quadrado arredondado laranja no formato do Mac -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa24a"/><stop offset="1" stop-color="#f0532c"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#5a1a08" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="25" fill="url(#fundo)" filter="url(#sombra)"/>
  <rect x="8" y="8" width="112" height="112" rx="25" fill="url(#luz)"/>
  <g filter="url(#sombra)">
    <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
      <line x1="46" y1="34" x2="46" y2="94"/>
      <path d="M82 46 C82 66 46 62 46 80"/>
    </g>
    <g fill="#fff">
      <circle cx="46" cy="32" r="10"/>
      <circle cx="46" cy="96" r="10"/>
      <circle cx="82" cy="42" r="10"/>
    </g>
    <g fill="#f36a32">
      <circle cx="46" cy="32" r="4.5"/>
      <circle cx="46" cy="96" r="4.5"/>
      <circle cx="82" cy="42" r="4.5"/>
    </g>
  </g>
</svg>
