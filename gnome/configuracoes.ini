# Configurações do GNOME (carregadas com: dconf load / < gnome/configuracoes.ini)
# O estilo Apple (botões, ícones, fonte, dock no estilo Mac etc.) é aplicado pelo Seletor de Tema.

[org/gnome/desktop/interface]
show-battery-percentage=true
clock-show-date=true

[org/gnome/desktop/peripherals/touchpad]
tap-to-click=true
two-finger-scrolling-enabled=true
natural-scroll=true

[org/gnome/settings-daemon/plugins/power]
ambient-enabled=false
idle-dim=false
power-saver-profile-on-low-battery=false
sleep-inactive-ac-type='nothing'
sleep-inactive-ac-timeout=3600
sleep-inactive-battery-type='nothing'

[org/gnome/desktop/session]
idle-delay=uint32 0

# Lixeira e arquivos temporários com mais de 30 dias são apagados sozinhos
[org/gnome/desktop/privacy]
remove-old-trash-files=true
remove-old-temp-files=true
old-files-age=uint32 30

# Loja não baixa atualizações sozinha em segundo plano (menos RAM, rede e SSD)
[org/gnome/software]
download-updates=false

[org/gnome/settings-daemon/plugins/color]
night-light-schedule-automatic=false

[org/gnome/shell]
enabled-extensions=['dash-to-dock@micxgx.gmail.com', 'kiwimenu@kemma', 'appindicatorsupport@rgcjonas.gmail.com']
favorite-apps=['org.gnome.Nautilus.desktop', 'org.gnome.Calendar.desktop', 'org.gnome.Console.desktop', 'org.gnome.Software.desktop', 'org.gnome.TextEditor.desktop', 'org.gnome.Calculator.desktop', 'local.luizfelipe.MonitorTemp.desktop', 'seletor-de-tema.desktop']

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
extend-height=false
dash-max-icon-size=48
custom-theme-shrink=true
transparency-mode='DYNAMIC'
background-opacity=0.80000000000000004
max-alpha=0.80000000000000004
height-fraction=0.90000000000000002
show-trash=true
click-action='cycle-windows'

[org/gnome/shell/extensions/blur-my-shell/popup]
screenshot-corner-radius=36

[org/gnome/desktop/app-folders]
folder-children=['System', 'Utilities']

[org/gnome/desktop/app-folders/folders/System]
apps=['nm-connection-editor.desktop', 'org.gnome.baobab.desktop', 'org.gnome.DiskUtility.desktop', 'org.gnome.Logs.desktop', 'org.freedesktop.MalcontentControl.desktop', 'org.gnome.SystemMonitor.desktop', 'org.gnome.tweaks.desktop', 'local.controle.zram.desktop', 'gufw.desktop', 'timeshift-gtk.desktop']
name='X-GNOME-Shell-System.directory'
translate=true

[org/gnome/desktop/app-folders/folders/Utilities]
apps=['org.gnome.Decibels.desktop', 'org.gnome.Connections.desktop', 'org.gnome.Papers.desktop', 'org.gnome.font-viewer.desktop', 'org.gnome.Loupe.desktop', 'org.gnome.Showtime.desktop']
name='X-GNOME-Shell-Utilities.directory'
translate=true

# Atalho do Vicinae (busca rápida). No estilo Apple vira Super+Espaço, como o Spotlight.
[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
name='Vicinae'
command='vicinae toggle'
binding='<Control>space'
