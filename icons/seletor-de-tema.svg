<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Seletor de Tema: maçã cujo "cabinho" são os dedos do pé do GNOME -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ee"/>
    </linearGradient>
    <linearGradient id="cor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ec5ff"/>
      <stop offset="0.5" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#7a4fd6"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.35" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="mordida">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="105" cy="74" r="11" fill="#000"/>
    </mask>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1a2b4c" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#fundo)" filter="url(#sombra)"/>
  <g filter="url(#sombra)">
    <g mask="url(#mordida)">
      <path id="maca" fill="url(#cor)" d="M64 59 C58 54 50 52 44 53 C33 55 28 66 29 78 C30 92 38 106 47 110
        C52 112 56 109 64 109 C72 109 76 112 81 110 C90 106 98 92 99 80 C99 66 94 55 84 53 C78 52 70 54 64 59 Z"/>
      <path fill="url(#brilho)" d="M64 59 C58 54 50 52 44 53 C33 55 28 66 29 78 C30 92 38 106 47 110
        C52 112 56 109 64 109 C72 109 76 112 81 110 C90 106 98 92 99 80 C99 66 94 55 84 53 C78 52 70 54 64 59 Z"/>
    </g>
    <!-- dedos do pé, do maior para o menor -->
    <ellipse cx="74" cy="36" rx="8.5" ry="11.5" transform="rotate(28 74 36)" fill="url(#cor)"/>
    <ellipse cx="59.5" cy="31" rx="5.6" ry="7.6" transform="rotate(8 59.5 31)" fill="url(#cor)"/>
    <ellipse cx="49" cy="36.5" rx="4.4" ry="6" transform="rotate(-18 49 36.5)" fill="url(#cor)"/>
    <ellipse cx="41.5" cy="44" rx="3.4" ry="4.6" transform="rotate(-42 41.5 44)" fill="url(#cor)"/>
  </g>
</svg>
