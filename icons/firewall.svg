<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Como o Firewall dos Ajustes do macOS: quadrado azul com a parede de tijolos branca -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#0a6cf0"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tijolo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#eaf3ff"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="leve" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.8" flood-color="#04307a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#fundo)" filter="url(#sombra)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#brilho)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#fff" stroke-opacity="0.18"/>
  <g fill="url(#tijolo)" filter="url(#leve)">
    <rect x="32" y="35" width="30.25" height="12" rx="2.5"/><rect x="65.75" y="35" width="30.25" height="12" rx="2.5"/>
    <rect x="32" y="50.5" width="12.5" height="12" rx="2.5"/><rect x="48" y="50.5" width="32" height="12" rx="2.5"/><rect x="83.5" y="50.5" width="12.5" height="12" rx="2.5"/>
    <rect x="32" y="66" width="30.25" height="12" rx="2.5"/><rect x="65.75" y="66" width="30.25" height="12" rx="2.5"/>
    <rect x="32" y="81.5" width="12.5" height="12" rx="2.5"/><rect x="48" y="81.5" width="32" height="12" rx="2.5"/><rect x="83.5" y="81.5" width="12.5" height="12" rx="2.5"/>
  </g>
</svg>
