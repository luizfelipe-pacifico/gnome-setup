# Limpeza automática do cache de cada usuário: o que fica sem uso pelo tempo indicado é apagado
# (roda sozinho todo dia pelo systemd-tmpfiles-clean.timer do usuário)
e %C/thumbnails          - - - 30d
e %C/yay                 - - - 3d
e %C/paru                - - - 3d
e %C/pip                 - - - 14d
e %C/uv                  - - - 14d
e %C/gnome-software      - - - 7d
e %C/fontconfig          - - - 30d
e %C/mesa_shader_cache   - - - 30d
e %C/nvidia              - - - 30d
