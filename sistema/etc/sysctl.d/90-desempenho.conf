# Memória: o zram é rápido, então vale usar ele cedo (valores recomendados pela ArchWiki para zram)
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
# Menos escrita no disco de uma vez (evita travadinhas ao copiar arquivos grandes)
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728
# Teclas mágicas do SysRq (sync, remount, reboot) para destravar o sistema em emergência
kernel.sysrq = 244
